<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XANA Business — Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="XANA Business — technical and user documentation">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #3a5a7d; }
    .markdown-section pre { border-radius: 6px; }
    .markdown-section code { border-radius: 4px; }

    /* Mermaid diagram wrapper + expand button */
    .mermaid-wrap {
      position: relative;
      margin: 1em 0;
    }
    .mermaid-wrap .mermaid {
      overflow-x: auto;
    }
    .mermaid-fullscreen-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 5;
      border: 1px solid #d0d5db;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 5px 8px;
      opacity: 0.55;
      transition: opacity 0.15s ease;
    }
    .mermaid-wrap:hover .mermaid-fullscreen-btn {
      opacity: 1;
    }

    /* Expand overlay — a plain in-page modal, not the native Fullscreen API
       (which is inconsistent across browsers/embedding contexts and hid the
       diagram entirely for some users). Fully our own CSS, no browser quirks. */
    .mermaid-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .mermaid-overlay-inner {
      /* Concrete size, not just max-width/max-height — the cloned SVG's own
         width="100%" needs a real, resolvable basis to size against, or it
         collapses to 0 (a shrink-to-fit container has no basis on its own). */
      width: 90vw;
      height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mermaid-overlay-inner svg {
      /* Forced to 100%/100% of the concrete box above; the SVG's own viewBox
         + default preserveAspectRatio scales it to fit without distortion. */
      width: 100% !important;
      height: 100% !important;
      max-width: 100%;
      max-height: 100%;
    }
    .mermaid-overlay-close {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 22px;
      line-height: 1;
      background: none;
      border: 1px solid #d0d5db;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'XANA Business Docs',
      repo: 'IndustryFusion/XanaAI-Business',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 2,
      auto2top: true,
      mergeNavbar: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs',
        noData: 'No results',
        depth: 4,
      },
      // Wrap ```mermaid code blocks in a <div class="mermaid"> — actual SVG
      // rendering happens afterward, in the doneEach hook below, since
      // Mermaid's own render call is async and the markdown renderer here
      // must return synchronously.
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid-wrap"><div class="mermaid">' + code + '</div></div>';
            }
            return this.origin.code.apply(this, arguments);
          },
        },
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (!window.mermaid) return;
            var nodes = document.querySelectorAll('.mermaid');
            if (nodes.length === 0) return;
            mermaid.run({ nodes: nodes }).then(function () {
              addFullscreenButtons();
            });
          });
        },
      ],
    };

    function addFullscreenButtons() {
      document.querySelectorAll('.mermaid-wrap').forEach(function (wrap) {
        if (wrap.querySelector('.mermaid-fullscreen-btn')) return; // already added
        var btn = document.createElement('button');
        btn.className = 'mermaid-fullscreen-btn';
        btn.title = 'Expand diagram';
        btn.setAttribute('aria-label', 'View diagram larger');
        btn.textContent = '⛶';
        btn.addEventListener('click', function () {
          var svg = wrap.querySelector('.mermaid svg');
          if (svg) openDiagramOverlay(svg);
        });
        wrap.appendChild(btn);
      });
    }

    function openDiagramOverlay(svgEl) {
      var overlay = document.createElement('div');
      overlay.className = 'mermaid-overlay';

      var closeBtn = document.createElement('button');
      closeBtn.className = 'mermaid-overlay-close';
      closeBtn.textContent = '✕ Close';
      closeBtn.setAttribute('aria-label', 'Close');

      var svgClone = svgEl.cloneNode(true);
      // Mermaid sets its own inline width/style (sized for its original,
      // in-flow container) — drop that so our CSS is the only thing sizing
      // the clone inside the overlay.
      svgClone.removeAttribute('style');
      svgClone.removeAttribute('width');
      svgClone.removeAttribute('height');

      var inner = document.createElement('div');
      inner.className = 'mermaid-overlay-inner';
      inner.appendChild(svgClone);

      overlay.appendChild(closeBtn);
      overlay.appendChild(inner);
      document.body.appendChild(overlay);

      function close() {
        overlay.remove();
        document.removeEventListener('keydown', onKeydown);
      }
      function onKeydown(e) {
        if (e.key === 'Escape') close();
      }
      closeBtn.addEventListener('click', close);
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) close();
      });
      document.addEventListener('keydown', onKeydown);
    }
  </script>
  <!-- Pinned versions — avoids version-drift breakage from floating @4/@latest tags -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
  </script>
</body>
</html>
